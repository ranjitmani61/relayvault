[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "relayvault"
version = "0.2.0"
description = "Local task checkpoints and reversible pattern redaction (MCP + REST)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RelayVault Contributors" }]
keywords = ["mcp", "model-context-protocol", "openai", "claude", "gemini", "deepseek", "kimi", "pii-redaction"]
dependencies = [
    "mcp>=1.30.0,<2",
    "fastapi>=0.163.0,<1",
    "uvicorn>=0.54.0,<1",
    "pydantic>=2.14.3,<3",
    "httpx>=0.28.1,<1",
    "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
dev = ["hatchling==1.30.1", "editables==0.6", "pytest>=9.2,<10", "pytest-asyncio>=1.5,<2", "ruff>=0.17.5,<0.18", "pip-audit>=2.10.1,<3", "build>=1.6.1,<2", "pip-tools>=7.6.2,<8"]

[project.urls]
Homepage = "https://github.com/ranjitmani61/relayvault"
Repository = "https://github.com/ranjitmani61/relayvault"
Issues = "https://github.com/ranjitmani61/relayvault/issues"

[project.scripts]
relayvault = "relayvault.cli:main"
relayvault-mcp = "relayvault.mcp_server:run_stdio"

[tool.hatch.build.targets.wheel]
packages = ["relayvault"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

markers = ["live: opt-in credentialed provider contract tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
