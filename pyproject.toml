[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relayvault"
version = "0.1.0"
description = "Zero-Trust Cross-Model Task State Handoff & Reversible Secret Redaction Bus (MCP + OpenAPI 3.1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RelayVault Contributors" }]
keywords = ["mcp", "model-context-protocol", "openai", "claude", "gemini", "deepseek", "kimi", "pii-redaction"]
dependencies = [
    "mcp>=1.2.0,<2",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
relayvault = "relayvault.cli:main"
relayvault-mcp = "relayvault.mcp_server:run_stdio"

[tool.hatch.build.targets.wheel]
packages = ["relayvault"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
