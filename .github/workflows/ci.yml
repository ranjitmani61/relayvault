name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned dependencies and project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run integration and security tests
        run: pytest -v
      - name: Measure synthetic detector corpus
        run: python scripts/redaction_report.py
      - name: Run MCP to REST handoff demo
        run: python demo_multi_model.py
      - name: Build and verify installed wheel
        run: |
          python -m build --no-isolation
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I scripts/wheel_smoke.py

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned audit tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Audit runtime and development dependencies
        run: |
          pip-audit --require-hashes -r requirements.lock
          pip-audit --require-hashes -r requirements-dev.lock

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build non-root image
        run: docker build -t relayvault-ci .
      - name: Verify container authentication and storage
        run: python scripts/docker_smoke.py
