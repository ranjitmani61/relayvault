name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint, test, and audit
        run: |
          ruff check .
          ruff format --check .
          pytest -v
          pip-audit --require-hashes -r requirements.lock
          pip-audit --require-hashes -r requirements-dev.lock
      - name: Build sdist and wheel
        run: |
          rm -rf dist/
          python -m build --no-isolation
          sha256sum dist/*
      - name: Smoke-test installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I scripts/wheel_smoke.py
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish distributions to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/relayvault
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          verify-metadata: true
          print-hash: true
          attestations: true
